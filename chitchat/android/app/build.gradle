plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
android {
    namespace 'app.chitchat'
    compileSdk 35
    defaultConfig { applicationId 'app.chitchat'; minSdk 26; targetSdk 35; versionCode 5; versionName '0.3.0-beta3' }
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs {
        owner {
            def keyPath = System.getenv('CHITCHAT_KEYSTORE_FILE')
            if (keyPath) {
                storeFile file(keyPath)
                storePassword System.getenv('CHITCHAT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('CHITCHAT_KEY_ALIAS')
                keyPassword System.getenv('CHITCHAT_KEY_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes { release {
        minifyEnabled false
        // CI can compile a diagnostic artifact without credentials, but its
        // publication step requires the owner's permanent signing key.
        signingConfig System.getenv('CHITCHAT_KEYSTORE_FILE') ? signingConfigs.owner : signingConfigs.debug
    } }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.crypto.tink:tink-android:1.24.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
