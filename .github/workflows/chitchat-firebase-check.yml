name: Build ChitChat Online Android beta
on:
  workflow_dispatch:
  push:
    branches: [codex/chitchat-online]
    paths:
      - 'chitchat/android/**'
      - 'chitchat/docs/FIREBASE-ANDROID.md'
      - 'chitchat/docs/ONLINE-ANDROID.md'
      - 'chitchat/scripts/publish-online-android.py'
      - '.github/workflows/chitchat-firebase-check.yml'
permissions:
  contents: read
jobs:
  android-online:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: chitchat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check unchanged Bluetooth protocol and Android syntax
        run: bash scripts/test.sh
      - name: Compile production APK, debug APK and native test APK
        run: gradle -p android --no-daemon testDebugUnitTest assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Start disposable local Cloudflare relay for synthetic clients
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          cd online
          npm ci
          python3 - <<'PYRELAY'
          import os,subprocess
          from pathlib import Path
          folder=Path(os.environ['RUNNER_TEMP'])
          log=(folder/'chitchat-local-relay.log').open('wb')
          child=subprocess.Popen(['node','node_modules/wrangler/bin/wrangler.js','dev','--local','--ip','127.0.0.1','--port','8787','--var','PILOT_INVITE_CODE:synthetic-client-invite'],stdin=subprocess.DEVNULL,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
          (folder/'chitchat-local-relay.pid').write_text(str(child.pid))
          PYRELAY
          node --input-type=module - <<'JS'
          for(let i=0;i<100;i++){
            try{const r=await fetch('http://127.0.0.1:8787/v1/health');if(r.ok){console.log('Synthetic local relay ready');process.exit(0);}}catch{}
            await new Promise(resolve=>setTimeout(resolve,250));
          }
          throw Error('Local relay did not start');
          JS
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Check actual Online UI, encrypted relay delivery and notification controls
        id: native
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          cores: 2
          disable-animations: true
          working-directory: chitchat
          script: |
            adb reverse tcp:8787 tcp:8787
            adb reverse --list
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant app.chitchat android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w app.chitchat.test/androidx.test.runner.AndroidJUnitRunner > notification-tests.txt
            cat notification-tests.txt
            mkdir -p dist/online-ui
            adb pull /sdcard/Android/data/app.chitchat/files/. dist/online-ui/
            python3 -c "from pathlib import Path; s=Path('notification-tests.txt').read_text(); assert 'OK (11 tests)' in s and 'FAILURES' not in s and 'INSTRUMENTATION_FAILED' not in s, 'Native Online checks failed'"
            adb shell pm clear app.chitchat
            mkdir -p dist
            cp android/app/build/outputs/apk/debug/app-debug.apk dist/ChitChat-android.apk
            python3 tests/android_smoke.py
            python3 tests/android_ble_pair.py
      - name: Verify production installer signature
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/ChitChat-0.3-beta2.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/ChitChat-0.3-beta2.apk
          sha256sum dist/ChitChat-0.3-beta2.apk > dist/SHA256SUMS-0.3-beta2.txt
      - name: Read public live service configuration without creating accounts
        run: |
          python3 - <<'PYHEALTH'
          import json,urllib.request
          from pathlib import Path
          try:
              with urllib.request.urlopen('https://chitchat-online.clintonpereira7977.workers.dev/v1/health',timeout=15) as response:
                  data=json.loads(response.read(4096))
              result={'reachable':True,**{k:data.get(k) for k in ['status','version','registrationConfigured','pushConfigured','pushPayload','appIntegration']}}
          except Exception:
              result={'reachable':False}
          Path('dist/LIVE-SERVICE.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PYHEALTH
      - name: Upload test evidence and installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChitChat-Online-Android-beta
          path: |
            chitchat/notification-tests.txt
            chitchat/android/app/build/reports/tests/
            chitchat/dist/online-ui/*.png
            chitchat/dist/online-ui/*.xml
            chitchat/dist/ui/*.png
            chitchat/dist/ChitChat-0.3-beta2.apk
            chitchat/dist/SHA256SUMS-0.3-beta2.txt
            chitchat/dist/LIVE-SERVICE.json
          if-no-files-found: ignore
      - name: Publish beta only after native Online and Bluetooth checks pass
        if: ${{ success() && steps.native.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-online-android.py
