name: Check ChitChat Android notification setup
on:
  workflow_dispatch:
  push:
    branches: [codex/chitchat-online]
    paths:
      - 'chitchat/android/**'
      - 'chitchat/docs/FIREBASE-ANDROID.md'
      - '.github/workflows/chitchat-firebase-check.yml'
permissions:
  contents: read
jobs:
  android-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: chitchat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile Firebase client resources and notification policy tests
        run: gradle -p android --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Check opt-in controls and native notification behavior
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          cores: 2
          disable-animations: true
          working-directory: chitchat
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell pm grant app.chitchat android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w app.chitchat.test/androidx.test.runner.AndroidJUnitRunner > notification-tests.txt
            cat notification-tests.txt
            python3 -c "from pathlib import Path; s=Path('notification-tests.txt').read_text(); assert 'OK (4 tests)' in s and 'FAILURES' not in s and 'INSTRUMENTATION_FAILED' not in s, 'Native notification checks failed'"
      - name: Upload test results (internal checkpoint; no public installer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChitChat-Firebase-check-results
          path: |
            chitchat/notification-tests.txt
            chitchat/android/app/build/reports/tests/
          if-no-files-found: ignore
